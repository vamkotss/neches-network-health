[project]
name = "neches-network-health"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
builtins = ["spark", "display", "dbutils"]
line-length = 100
src = ["src", "tests"]
